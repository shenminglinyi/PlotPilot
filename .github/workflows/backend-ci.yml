name: Backend CI

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "official-plugins/**"
      - "infrastructure/persistence/database/migrations/*.sql"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run the bounded pilot slice even when unrelated unit tests are failing.
      # Do not opt the entire integration suite into CI.
      - name: Run official plugin pilot integration tests
        run: python -m pytest tests/integration/test_plugin_pilot.py -q --tb=short
        env:
          DISABLE_AUTO_DAEMON: "1"

      - name: Run unit tests
        run: pytest tests/unit -q --tb=short
        env:
          # 单测不需要真实 key，用占位值防止启动时报错
          ANTHROPIC_API_KEY: "test-placeholder"
          ARK_API_KEY: "test-placeholder"
