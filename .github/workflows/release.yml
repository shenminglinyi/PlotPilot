name: Release desktop updater

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GitHub Windows runners otherwise expose a cp1252 stdout stream. The build
  # scripts and PyInstaller diagnostics contain Chinese text and require UTF-8.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  publish-windows:
    name: Build, sign and publish Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Require updater signing secrets
        shell: pwsh
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured"
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured"
          }

      - name: Validate tag and synchronized version
        shell: pwsh
        run: |
          python scripts/sync_release_version.py --check
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match VERSION=$version"
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-nsis.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frozen backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r requirements-nsis.txt
          python scripts/build_backend_pyinstaller.py --force

      - name: Build signed installer and publish updater manifest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: PlotPilot ${{ github.ref_name }}
          releaseBody: |
            PlotPilot desktop release ${{ github.ref_name }}.

            The application can download this signed update from Settings > About.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: PlotPilot_[version]_[arch][setup].[ext]
          retryAttempts: 2

      - name: Verify updater assets and manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP "plotpilot-release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          gh release download "${{ github.ref_name }}" --dir $releaseDir

          $assets = Get-ChildItem -LiteralPath $releaseDir -File
          $installer = @($assets | Where-Object Name -Like "*.exe")
          $signatures = @($assets | Where-Object Name -Like "*.exe.sig")
          $manifest = Join-Path $releaseDir "latest.json"

          if ($installer.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installer.Count)"
          }
          if ($signatures.Count -ne 1) {
            throw "Expected exactly one updater signature, found $($signatures.Count)"
          }
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "latest.json is missing from the draft release"
          }

          $version = (Get-Content VERSION -Raw).Trim()
          python scripts/finalize_updater_manifest.py `
            --manifest $manifest `
            --repository "${{ github.repository }}" `
            --tag "${{ github.ref_name }}" `
            --installer $installer[0].Name

          python scripts/validate_updater_manifest.py `
            --manifest $manifest `
            --version $version `
            --tag "${{ github.ref_name }}" `
            --installer $installer[0].Name `
            --signature-file $signatures[0].FullName

          gh release upload "${{ github.ref_name }}" $manifest --clobber

      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
