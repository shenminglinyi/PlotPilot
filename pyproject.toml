[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]

[tool.pytest.ini_options.markers]
unit = "unit tests"
integration = "integration tests"
slow = "slow tests"

[project]
name = "plotpilot"
version = "0.1.0"
dependencies = [
    "anthropic>=0.40.0",
    "ebooklib>=0.18",
    "fastapi>=0.109.0",
    "fpdf2>=2.7.0",
    "httpx==0.27.0",
    "httpx2>=2.13.0",
    "jinja2>=3.1.0",
    "json-repair>=0.30.0",
    "lxml>=4.9.0",
    "openai>=1.65.0,<2.0.0",
    "pydantic>=2.0.0",
    "pytest>=7.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0.1",
    "uvicorn[standard]>=0.27.0",
    "volcengine-python-sdk[ark]>=1.0.0",
]
